<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BFL Siber — Erişim Sağlandı</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --accent-green: #2ea043;
            --accent-cyan: #38bdf8;
            --text-muted: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 2rem 1rem;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1.5rem;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .badge {
            background-color: rgba(46, 160, 67, 0.15);
            color: #3fb950;
            border: 1px solid rgba(46, 160, 67, 0.4);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        h1 {
            font-size: 1.75rem;
            color: #ffffff;
        }

        .status-bar {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 2rem;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #3fb950;
            box-shadow: 0 0 8px #3fb950;
        }

        .announcements-grid {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .announcement-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            transition: border-color 0.2s ease;
        }

        .announcement-card:hover {
            border-color: #58a6ff;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 0.75rem;
            gap: 1rem;
        }

        .card-title {
            font-size: 1.2rem;
            color: #ffffff;
            font-weight: 600;
        }

        .card-date {
            font-size: 0.8rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .card-body {
            line-height: 1.6;
            color: #8b949e;
            white-space: pre-wrap;
        }

        .loading, .error {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        .error {
            color: #f85149;
            border-color: rgba(248, 81, 73, 0.4);
        }

        footer {
            margin-top: 3rem;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 1.5rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>BFL Siber Paneli</h1>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">
                Üyelere Özel İç Duyuru Portalı
            </p>
        </div>
        <span class="badge">Testi Geçtin</span>
    </header>

    <div class="status-bar">
        <div class="status-indicator"></div>
        <span>Kimlik doğrulama seviyesi: <strong>Seviye 1 (Atlatıldı)</strong> — Ekibe hoş geldin.</span>
    </div>

    <section id="announcements-container" class="announcements-grid">
        <div class="loading">Gizli duyurular çekiliyor...</div>
    </section>

    <footer>
        <p>&copy; BFL Siber Güvenlik Grubu — Sadece Yetkili Erişim</p>
    </footer>
</div>

<script>
    /**
     * KONFİGÜRASYON
     */
    const CONFIG = {
        // Admin sunucu adresi (kullanılmıyorsa boş bırakılabilir)
        ADMIN_API_URL: '',
        
        // GitHub Gist Kimliği
        GIST_ID: 'e75637adcf06c0fa04a244bca28e741e',
        
        // Veri çekilemezse gösterilecek yedek metin
        DEMO_ANNOUNCEMENTS: [
            {
                id: "1",
                title: "nothing to see here",
                date: new Date().toISOString(),
                content: "nothing to see here"
            }
        ]
    };

    /**
     * Duyuruları Çekme Motoru
     */
    async function fetchAnnouncements() {
        const container = document.getElementById('announcements-container');

        try {
            let items = null;

            // 1. Gist ID tanımlıysa GitHub Gist API'den veriyi çek
            if (CONFIG.GIST_ID) {
                const gistRes = await fetch(`https://api.github.com/gists/${CONFIG.GIST_ID}`);
                if (gistRes.ok) {
                    const gistData = await gistRes.json();
                    const firstFileKey = Object.keys(gistData.files)[0];
                    const rawContent = gistData.files[firstFileKey].content;
                    
                    try {
                        items = JSON.parse(rawContent);
                    } catch (e) {
                        // Eğer Gist düz metin ise obje formatına çevir
                        items = [{
                            title: "Duyuru",
                            content: rawContent,
                            date: gistData.updated_at
                        }];
                    }
                }
            }

            // 2. Gist yoksa veya başarısız olduysa API'yi dene
            if (!items && CONFIG.ADMIN_API_URL) {
                try {
                    const apiRes = await fetch(CONFIG.ADMIN_API_URL, {
                        method: 'GET',
                        headers: { 'Accept': 'application/json' }
                    });
                    if (apiRes.ok) {
                        const json = await apiRes.json();
                        items = json.data || json;
                    }
                } catch (e) {
                    console.warn("API sunucusuna ulaşılamadı, yedek veriye geçiliyor.");
                }
            }

            // 3. Veri bulunamazsa varsayılan yedek veriyi göster
            if (!items || (Array.isArray(items) && items.length === 0)) {
                items = CONFIG.DEMO_ANNOUNCEMENTS;
            }

            renderAnnouncements(items);

        } catch (err) {
            console.error("Duyurular yüklenirken hata oluştu:", err);
            renderAnnouncements(CONFIG.DEMO_ANNOUNCEMENTS);
        }
    }

    /**
     * XSS Korumalı HTML İşleme
     */
    function renderAnnouncements(items) {
        const container = document.getElementById('announcements-container');
        const list = Array.isArray(items) ? items : [items];

        if (!list || list.length === 0) {
            container.innerHTML = '<div class="loading">Henüz yayınlanmış bir duyuru yok.</div>';
            return;
        }

        container.innerHTML = list.map(item => {
            const title = escapeHTML(item.title || item.name || "nothing to see here");
            const content = escapeHTML(item.content || item.description || "nothing to see here");
            const dateStr = item.date || item.createdAt 
                ? new Date(item.date || item.createdAt).toLocaleDateString('tr-TR') 
                : "Güncel";

            return `
                <article class="announcement-card">
                    <div class="card-header">
                        <h2 class="card-title">${title}</h2>
                        <span class="card-date">${dateStr}</span>
                    </div>
                    <div class="card-body">${content}</div>
                </article>
            `;
        }).join('');
    }

    /**
     * XSS Önleme Fonksiyonu
     */
    function escapeHTML(str) {
        if (typeof str !== 'string') return '';
        return str.replace(/[&<>'"]/g, 
            tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag] || tag)
        );
    }

    // Sayfa yüklendiğinde çalıştır
    document.addEventListener('DOMContentLoaded', fetchAnnouncements);
</script>

</body>
</html>
