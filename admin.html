<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - BFLSiber</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#000000;
  --surface:#0d1117;
  --border:#00ff00;
  --accent:#00ff00;
  --text:#00ff00;
  --muted:#00ff00;
  --mono:'Space Mono',monospace;
  --sans:'Inter',sans-serif;
  --error:#ff3333;
}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh}
nav{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 2rem;border-bottom:1px solid var(--border)}
.logo{font-family:var(--mono);font-size:1rem;color:var(--accent);text-decoration:none}
.back{font-family:var(--mono);font-size:0.8rem;color:var(--muted);text-decoration:none;background:transparent;border:none;cursor:pointer}
.back:hover{color:var(--text);opacity:0.8}
main{max-width:600px;margin:6rem auto;padding:0 2rem}
.page-tag{font-family:var(--mono);font-size:0.7rem;color:var(--accent);letter-spacing:0.2em;text-transform:uppercase;margin-bottom:1rem}
h1{font-size:2.5rem;font-weight:300;letter-spacing:-0.03em;margin-bottom:0.75rem}
.sub{color:var(--muted);font-size:0.95rem;line-height:1.7;margin-bottom:3rem}

/* Form Elemanları */
.field{margin-bottom:1.5rem}
label{display:block;font-family:var(--mono);font-size:0.75rem;color:var(--muted);letter-spacing:0.1em;margin-bottom:0.5rem}
input{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:var(--sans);font-size:0.95rem;padding:0.75rem 1rem;border-radius:4px;outline:none;transition:border-color 0.2s}
input:focus{border-color:var(--accent)}
.submit{width:100%;background:var(--accent);color:#000;font-family:var(--mono);font-size:0.9rem;font-weight:700;padding:0.875rem;border:none;border-radius:4px;cursor:pointer;transition:opacity 0.2s}
.submit:hover{opacity:0.85}

/* Hata ve Durum Kutuları */
.error-msg{display:none;color:var(--error);font-family:var(--mono);font-size:0.8rem;margin-top:1rem;text-align:center}

/* Dashboard Alanı */
#dashboard-screen{display:none}
.status-card{background:rgba(0,255,0,0.05);border:1px solid var(--border);border-radius:4px;padding:1rem 1.25rem;font-family:var(--mono);font-size:0.8rem;margin-bottom:2rem;display:flex;align-items:center;gap:0.75rem}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}

.announcements-list{display:flex;flex-direction:column;gap:1.5rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:1.5rem}
.card-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:0.75rem;border-bottom:1px dashed rgba(0,255,0,0.3);padding-bottom:0.5rem}
.card-title{font-family:var(--mono);font-size:1.05rem;color:var(--accent);font-weight:700}
.card-date{font-family:var(--mono);font-size:0.75rem;color:var(--muted);opacity:0.8}
.card-body{font-size:0.95rem;line-height:1.6;white-space:pre-wrap;color:var(--text)}

.loading-state{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:2rem;text-align:center;font-family:var(--mono);font-size:0.85rem;color:var(--muted)}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">BFLSiber</a>
  <div id="nav-action">
    <a href="index.html" class="back">← Geri</a>
  </div>
</nav>

<main>
  <!-- KİMLİK DOĞRULAMA (AUTH) EKRANI -->
  <div id="auth-screen">
    <div class="page-tag">Admin Portalı</div>
    <h1>Erişim Yetkisi</h1>
    <p class="sub">Yönetim paneline erişmek için parolanızı girin</p>

    <form id="adminLoginForm" onsubmit="handleLogin(event)">
      <div class="field">
        <label>Parola:</label>
        <input type="password" id="adminPassword" placeholder="••••••••" required autocomplete="off">
      </div>
      <button type="submit" class="submit">Giriş Yap →</button>
      <div id="authError" class="error-msg">Hatalı parola! Erişim reddedildi.</div>
    </form>
  </div>

  <!-- DASHBOARD EKRANI -->
  <div id="dashboard-screen">
    <div class="page-tag">Sistem Paneli</div>
    <h1>Duyurular</h1>
    <p class="sub">Yetkili üye paneline hoş geldiniz</p>

    <div class="status-card">
      <div class="status-dot"></div>
      <span>Oturum Açıldı: Level 1 (Doğrulandı)</span>
    </div>

    <div id="announcementsContainer" class="announcements-list">
      <div class="loading-state">Duyurular çekiliyor...</div>
    </div>
  </div>
</main>

<script>
const CONFIG = {
  GIST_ID: 'e75637adcf06c0fa04a244bca28e741e',
  DEMO_PASSWORD_HASH: '8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918', // SHA-256 for "admin"
  DEMO_ANNOUNCEMENTS: [
    {
      title: "nothing to see here",
      content: "nothing to see here",
      date: new Date().toISOString()
    }
  ]
};

let cachedPayload = null;

// SHA-256 Hash Fonksiyonu
async function sha256(message) {
  const msgBuffer = new TextEncoder().encode(message);
  const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

// Gist üzerinden Veri/Hash Çekme
async function fetchGistPayload() {
  if (cachedPayload) return cachedPayload;

  try {
    const res = await fetch(`https://api.github.com/gists/${CONFIG.GIST_ID}`);
    if (res.ok) {
      const gistData = await res.json();
      const firstFileKey = Object.keys(gistData.files)[0];
      const content = gistData.files[firstFileKey].content;

      try {
        cachedPayload = JSON.parse(content);
      } catch (e) {
        cachedPayload = {
          passwordHash: CONFIG.DEMO_PASSWORD_HASH,
          announcements: [{ title: "Duyuru", content: content, date: gistData.updated_at }]
        };
      }
      return cachedPayload;
    }
  } catch (err) {
    console.warn("Gist bağlantısı kurulamadı. Varsayılan veri kullanılıyor.");
  }

  return {
    passwordHash: CONFIG.DEMO_PASSWORD_HASH,
    announcements: CONFIG.DEMO_ANNOUNCEMENTS
  };
}

// Giriş Kontrolü
async function handleLogin(e) {
  e.preventDefault();
  const inputPass = document.getElementById('adminPassword').value;
  const errorDiv = document.getElementById('authError');
  errorDiv.style.display = 'none';

  const inputHash = await sha256(inputPass);
  const payload = await fetchGistPayload();
  const validHash = payload.passwordHash || payload.authHash || CONFIG.DEMO_PASSWORD_HASH;

  if (inputHash === validHash || inputPass === payload.password) {
    sessionStorage.setItem('authenticated', 'true');
    renderDashboard(payload.announcements || payload);
  } else {
    errorDiv.style.display = 'block';
    document.getElementById('adminPassword').value = '';
  }
}

// Oturumu Kapatma
function handleLogout() {
  sessionStorage.removeItem('authenticated');
  location.reload();
}

// Dashboard Görünümü Render
function renderDashboard(announcements) {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('dashboard-screen').style.display = 'block';
  
  // Navigasyona Çıkış Yap Butonu Ekle
  document.getElementById('nav-action').innerHTML = `<button onclick="handleLogout()" class="back">Çıkış Yap ✕</button>`;

  const container = document.getElementById('announcementsContainer');
  const list = Array.isArray(announcements) ? announcements : [announcements];

  if (!list || list.length === 0) {
    container.innerHTML = `<div class="loading-state">Yayınlanmış duyuru yok.</div>`;
    return;
  }

  container.innerHTML = list.map(item => `
    <article class="card">
      <div class="card-header">
        <div class="card-title">${escapeHTML(item.title || "nothing to see here")}</div>
        <div class="card-date">${item.date ? new Date(item.date).toLocaleDateString('tr-TR') : 'Güncel'}</div>
      </div>
      <div class="card-body">${escapeHTML(item.content || "nothing to see here")}</div>
    </article>
  `).join('');
}

function escapeHTML(str) {
  if (typeof str !== 'string') return '';
  return str.replace(/[&<>'"]/g, tag => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
  }[tag] || tag));
}

// Oturum Durumu Kontrolü
document.addEventListener('DOMContentLoaded', async () => {
  if (sessionStorage.getItem('authenticated') === 'true') {
    const payload = await fetchGistPayload();
    renderDashboard(payload.announcements || payload);
  }
});
</script>

</body>
</html>
